<details class="aviandr-panel"><summary>Добавить уточнённое сведение врача</summary>
<p>Запись хранится с автором и датой; новая запись уточняет прежнюю.</p>
<form action="/patients/{{ patient.id }}/ai-analysis/aviandr/facts" method="post">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="client_token" value="{{ av_token }}"><input type="hidden" name="return_to" value="/patients/{{ patient.id }}/ai-analysis#aviandr">
<label>Вид сведения<select name="kind">{% for key,label in av_kinds.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label>
<label>Возраст · для записи возраста<input type="number" name="value" min="0" max="130"></label>
<label>Код диагноза / точное обозначение фактора или вещества<input name="key" maxlength="200"></label>
<label>Состояние фактора<select name="state">{% for key,label in av_states.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label>
<label>Препарат · для записи о приёме<select name="drug_code">{% for d in av_drugs %}<option value="{{ d.code }}">{{ d.name }}</option>{% endfor %}</select></label>
<label>Фактический статус терапии<select name="therapy_state">{% for key,label in av_therapy.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label>
<label>Проверенное МНН<input name="inn" maxlength="200"></label>
<label class="check"><input type="checkbox" name="identity_confirmed" value="yes"> Название и МНН проверены мной</label>
<label>Дата фактического начала<input type="date" name="start" max="{{ av_today }}"></label>
<label>Дата сведения<input type="date" name="day" value="{{ av_today }}" max="{{ av_today }}" required></label>
<label>Основание / документ / что уточнено<textarea name="note" minlength="8" maxlength="2000" required></textarea></label>
<label class="check"><input type="checkbox" name="confirmed" value="yes"> Сведение проверено мной</label>
<button>Сохранить сведение</button></form></details>
