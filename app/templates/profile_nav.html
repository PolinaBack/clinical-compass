{% from 'icons.html' import icon %}
<nav class="tab-nav profile-nav" aria-label="Разделы личного профиля">
    {% for key,label,symbol in [('about','Обо мне','anthropometry'),('assessments','Анкеты','scales'),('video','Консультации и видеосвязь','consultation')] %}
        <a href="/patients/{{ patient.id }}/profile/{{ key }}"
           {% if section == key %}aria-current="page"{% endif %}>{{ icon(symbol) }}<span>{{ label }}</span></a>
    {% endfor %}
</nav>
