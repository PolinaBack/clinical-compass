<details class="extract-source-field"><summary>{{ item.title }} <small>{{ item.count }} заполненных сведений</small></summary><p class="caption">{{ item.source }}</p><label class="check"><input type="checkbox" name="include_{{ item.key }}" value="yes" {% if item.included %}checked{% endif %}>Включить в документ</label><label>Текст раздела · {{ item.title }}<textarea name="source_{{ item.key }}" rows="5">{{ item.text }}</textarea></label>{% if not item.text %}<p class="caption">Заполненных сведений пока нет.</p>{% endif %}</details>
