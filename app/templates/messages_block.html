<section class="card" id="messages">
    <h2>Связь с {{ 'пациентом' if user == 'doctor' else 'врачом' }}</h2>
    {% for m in messages %}
        <article class="message"><strong>{{ m.author }} · {{ m.day }}</strong>
            <p class="text">{{ m.body }}</p>
        </article>
    {% else %}
        <p>Сообщений пока нет. Задайте вопрос или оставьте рекомендацию.</p>
    {% endfor %}
    <form action="/patients/{{ patient.id }}/messages" method="post">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label>
            {{ 'Рекомендация / ответ врача' if user == 'doctor' else 'Вопрос врачу' }}<textarea id="message-text" name="body" maxlength="3000" required></textarea>
        </label>
        <button type="button" class="secondary voice" data-target="message-text">🎙 Голосовой ввод</button>
        <button>Отправить</button>
    </form>
</section>
