{% extends 'base.html' %}
{% block content %}
    <section class="card narrow">
        <p class="eyebrow">{{ status }}</p>
        <h1>{{ 'Нужно войти в свой кабинет' if status == 401 else 'Действие не выполнено' }}</h1>
        <p role="alert">{{ detail }}</p>
        <p>Не показываем успешное сохранение, если операция не завершилась.</p>
        <a class="button" href="{{ '/doctor' if user == 'doctor' else '/me' if user else '/' }}">{{ 'Вернуться в кабинет' if user else 'К началу' }}</a><a class="button secondary" href="/faq">Читать FAQ</a>
    </section>
{% endblock %}
