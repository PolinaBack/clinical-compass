<section id="resources" class="resources-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow">МОЖНО НАЧАТЬ СО ЗНАКОМСТВА</p>
            <h2>Полезно каждому пациенту</h2>
        </div>
        <div class="carousel-controls">
            <button type="button"
                    class="circle-button"
                    data-scroll="-1"
                    aria-label="Предыдущие полезные материалы"
                    aria-controls="resource-track">←</button>
            <button type="button"
                    class="circle-button"
                    data-scroll="1"
                    aria-label="Следующие полезные материалы"
                    aria-controls="resource-track">→</button>
        </div>
    </div>
    <div id="resource-track"
         class="resource-track"
         tabindex="0"
         role="region"
         aria-label="Полезные материалы, горизонтальная прокрутка">
        {% for number,title,body,url,color in resources %}
        <a class="resource-card {{ color }}" href="{{ url }}"><span class="resource-number">{{ number }} <span aria-hidden="true">→</span></span>
        <h3>{{ title }}</h3>
        <p>{{ body }}</p>
        <span class="resource-read">Читать материал →</span></a>
{% endfor %}
</div>
<p class="muted caption">Листайте стрелками, свайпом или клавишами ← →. Материалы доступны без прохождения анкет.</p>
</section>
