{% set request_state=information_request_states|default({}) %}{% set state=request_state.get(information_topic,'pending' if information_requests|selectattr('topic','equalto',information_topic)|list else 'empty') %}
<div data-information-request-control="{{ information_topic }}" data-information-state="{{ state }}" data-patient-id="{{ patient.id }}" data-category="{{ 'medicines' if information_topic in ['medicines','allergies'] else 'health' if information_topic=='conditions' else 'goals' }}">
<form method="post" action="/patients/{{ patient.id }}/information-requests" class="information-request-form"><input name="csrf" type="hidden" value="{{ csrf }}"><input name="topic" type="hidden" value="{{ information_topic }}"><button type="submit" {% if state=='pending' %}disabled{% endif %}>{{ 'Запрос отправлен' if state=='pending' else 'Запросить у пациента' }}</button></form></div>
