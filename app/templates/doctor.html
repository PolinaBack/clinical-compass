{% extends 'base.html' %}
{% block title %}Пациенты · Клинический компас{% endblock %}
{% block content %}
<h1 class="visually-hidden">Мои пациенты</h1>
<div class="patient-grid" id="patient-cards">
{% for p in patients %}<section class="card patient-preview"><div class="avatar" aria-hidden="true">{{ p.name[-1] }}</div><h2>{{ p.name }}</h2><p class="caption">Профиль закреплён за вами</p><a class="button full" href="/patients/{{ p.id }}">Карточка пациента</a></section>
{% else %}<section class="card"><h2>Пока нет закреплённых пациентов</h2></section>{% endfor %}
</div>
{% endblock %}
