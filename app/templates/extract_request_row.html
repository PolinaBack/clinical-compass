<fieldset class="extract-request-row" data-request-row><legend data-request-row-title>Документ {{ document_index + 1 }}</legend>
<label>Вид документа<select name="doc_{{ document_index }}_kind" data-document-field="kind">{% for key,label in request_kinds.items() %}<option value="{{ key }}" {% if requested.kind==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<div class="grid two"><label>Цель / куда предоставить<select name="doc_{{ document_index }}_purpose" data-document-field="purpose">{% for key,label in request_purposes.items() %}<option value="{{ key }}" {% if requested.purpose==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Учреждение / уточнение цели<input name="doc_{{ document_index }}_purpose_other" data-document-field="purpose_other" value="{{ requested.purpose_other }}" placeholder="Получатель этой справки"></label></div>
<div class="grid two"><label>К какому сроку<select name="doc_{{ document_index }}_due" data-document-field="due" data-request-due>{% for key,label in request_due.items() %}<option value="{{ key }}" {% if requested.due==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Дата, если нужна<input type="date" name="doc_{{ document_index }}_due_date" data-document-field="due_date" data-request-date min="{{ request_today }}" value="{{ requested.due_date }}"><small>Укажите при выборе «К определённой дате».</small></label></div>
<button type="button" class="secondary" data-remove-request-document hidden>Убрать документ</button></fieldset>
